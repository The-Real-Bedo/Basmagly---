name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Project site lives at https://<owner>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/
      # Disable Jekyll so Pages serves dist as-is (needed for the branch-based path).
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Path A: Pages source = "GitHub Actions".
  deploy-actions:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Path B: Pages source = "Deploy from a branch" → point it at `gh-pages` / root.
  # Keeps the live site built even if the repo setting was never switched to Actions.
  deploy-branch:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: /tmp/pages
      - run: mkdir -p /tmp/site && tar -xf /tmp/pages/artifact.tar -C /tmp/site
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/site
          publish_branch: gh-pages
          force_orphan: true
